<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'light'}catch(e){}</script>
<title>AI Assistant — Tripartite</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f5f5f7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tripartite">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/shared.css">
<style>
.ai-page-wrap{display:flex;flex-direction:column;height:calc(100vh - 56px);overflow:hidden}
.ai-full-msgs{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.ai-full-msg{display:flex;flex-direction:column;max-width:78%;gap:4px}
.ai-full-msg.user{align-self:flex-end;align-items:flex-end}
.ai-full-msg.ai{align-self:flex-start;align-items:flex-start}
.ai-full-msg .bubble{padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.ai-full-msg.user .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.ai-full-msg.ai .bubble{background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px;color:var(--text)}
.ai-full-msg .ts{font-size:10px;color:var(--muted);margin:0 4px}
.ai-full-bar{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end;background:var(--bg)}
.ai-full-bar textarea{flex:1;resize:none;border:1px solid var(--border2);border-radius:10px;padding:9px 12px;font-size:14px;background:var(--surface);color:var(--text);font-family:inherit;min-height:40px;max-height:130px;transition:border .15s;overflow-y:auto}
.ai-full-bar textarea:focus{outline:none;border-color:var(--accent)}
.ai-full-bar button{height:40px;width:40px;border-radius:10px;background:var(--accent);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity .15s}
.ai-full-bar button:disabled{opacity:.45;cursor:not-allowed}
.ai-full-bar button.send-btn{background:var(--accent)}
.ai-typing{display:flex;gap:5px;align-items:center;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:16px;border-bottom-left-radius:4px;width:fit-content}
.ai-typing span{width:4px;height:4px;border-radius:50%;background:var(--accent);animation:bounce 1.2s infinite ease-in-out}
.ai-typing span:nth-child(2){animation-delay:.2s}
.ai-typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
.ai-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted)}
.ai-empty i{font-size:48px;color:var(--accent);opacity:.35}
.ai-empty p{font-size:14px;text-align:center;max-width:280px;line-height:1.6}
.no-key-warn{background:var(--amber-bg,#fef9ec);border:1px solid var(--amber,#f59e0b);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--amber,#b45309);display:flex;align-items:center;gap:8px;margin:12px 16px 0}
</style>
</head>
<body>
<div class="sidebar-overlay" id="sb-overlay" onclick="closeSidebar()"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <i class="fa-solid fa-robot"></i>
      <span>AI Assistant</span>
      <div class="sb-actions" id="sb-theme-btns"></div>
    </div>
    <div class="user-chip">
      <div class="uavatar" id="user-avatar"><i class="fa-solid fa-user" style="font-size:9px"></i></div>
      <div class="uname" id="user-name">User</div>
      <button class="logout-btn" onclick="doLogout()"><i class="fa-solid fa-right-from-bracket"></i></button>
    </div>
    <div class="nav-back" onclick="window.location.href='/hub.html'"><i class="fa-solid fa-arrow-left"></i> All systems</div>
    <div class="nav-section">Controls</div>
    <div class="nav-item danger" onclick="confirmClearHistory()"><i class="fa-solid fa-trash"></i> Clear history</div>
    <div style="padding:16px 14px;font-size:12px;color:var(--muted);line-height:1.6">History persists through your login session and is shared with the AI bubble on all pages.</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:6px">
        <div class="hamburger" id="hamburger" onclick="openSidebar()"><i class="fa-solid fa-bars"></i></div>
        <i class="fa-solid fa-robot" style="color:var(--accent)"></i>
        <h2>AI Assistant</h2>
      </div>
    </div>

    <div id="no-key-banner" style="display:none" class="no-key-warn">
      <i class="fa-solid fa-triangle-exclamation"></i>
      No NVIDIA NIM API key set — <a href="/profile.html" style="color:var(--accent);font-weight:600;margin-left:4px">add one in Profile</a>
    </div>

    <div class="ai-page-wrap">
      <div class="ai-full-msgs" id="ai-msgs">
        <div class="ai-empty" id="ai-empty">
          <i class="fa-solid fa-robot"></i>
          <p>Ask me anything about your business. I'm powered by NVIDIA NIM (Llama 3.3 70B).</p>
        </div>
      </div>
      <div class="ai-full-bar">
        <textarea id="ai-input" placeholder="Ask a question…" rows="1" onkeydown="handleAiKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="ai-send-btn" onclick="sendAiMessage()" title="Send"><i class="fa-solid fa-paper-plane"></i></button>
      </div>
    </div>
  </div>
</div>

<script src="/motion.js"></script>
<script src="/shared.js"></script>
<script>
let aiTyping = false;

(async function init(){
  setupPWA(); buildThemeButtons('sb-theme-btns');
  const u = await checkAuth();
  if (!u) return;
  updateUserUI(u);
  setupOverlayClose();
  // AI bubble intentionally omitted — we're already on the AI page

  const key = localStorage.getItem('nim_api_key');
  if (!key) document.getElementById('no-key-banner').style.display = 'flex';

  renderFullHistory();
  scrollToBottom();
})();

function autoResize(el){
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 130) + 'px';
}

function handleAiKey(e){
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendAiMessage(); }
}

function scrollToBottom(){
  const msgs = document.getElementById('ai-msgs');
  if (msgs) msgs.scrollTop = msgs.scrollHeight;
}

function formatTime(iso){
  if (!iso) return '';
  try { return new Date(iso).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}); } catch{ return ''; }
}

function renderFullHistory(){
  const history = getAiHistory();
  const container = document.getElementById('ai-msgs');
  const empty = document.getElementById('ai-empty');
  if (!history.length) { empty.style.display = 'flex'; return; }
  empty.style.display = 'none';
  container.innerHTML = '';
  history.forEach(m => {
    const div = document.createElement('div');
    div.className = `ai-full-msg ${m.role === 'user' ? 'user' : 'ai'}`;
    div.innerHTML = `<div class="bubble">${escHtml(m.content)}</div><span class="ts">${formatTime(m.ts)}</span>`;
    container.appendChild(div);
  });
  scrollToBottom();
}

function appendMessage(role, content, ts){
  const empty = document.getElementById('ai-empty');
  if (empty) empty.style.display = 'none';
  const container = document.getElementById('ai-msgs');
  const div = document.createElement('div');
  div.className = `ai-full-msg ${role === 'user' ? 'user' : 'ai'}`;
  div.innerHTML = `<div class="bubble">${escHtml(content)}</div><span class="ts">${formatTime(ts)}</span>`;
  container.appendChild(div);
  scrollToBottom();
  return div;
}

function showTypingIndicator(){
  const container = document.getElementById('ai-msgs');
  const div = document.createElement('div');
  div.className = 'ai-full-msg ai'; div.id = 'typing-indicator';
  div.innerHTML = `<div class="ai-typing"><span></span><span></span><span></span></div>`;
  container.appendChild(div); scrollToBottom();
}

function removeTypingIndicator(){
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

async function sendAiMessage(){
  if (aiTyping) return;
  const input = document.getElementById('ai-input');
  const text = input.value.trim(); if (!text) return;
  const key = localStorage.getItem('nim_api_key');
  if (!key) { document.getElementById('no-key-banner').style.display = 'flex'; return; }
  input.value = ''; input.style.height = 'auto';
  const ts = new Date().toISOString();
  const history = getAiHistory();
  history.push({ role: 'user', content: text, ts });
  saveAiHistory(history);
  appendMessage('user', text, ts);
  aiTyping = true;
  document.getElementById('ai-send-btn').disabled = true;
  showTypingIndicator();
  try {
    const ctx = await getAiContext();
    const messagesForApi = [
      { role: 'system', content: ctx },
      ...history.filter(m => m.role !== 'system').map(m => ({ role: m.role, content: m.content }))
    ];
    const r = await fetch(`${API}/ai/chat`, {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: messagesForApi, api_key: key })
    });
    removeTypingIndicator();
    const d = await r.json();
    const rawReply = r.ok ? (d.reply || 'No response') : (d.error || 'Error from AI');
    const { text: cleanReply, action } = parseAiResponse(rawReply);
    const aiTs = new Date().toISOString();
    history.push({ role: 'assistant', content: cleanReply, ts: aiTs });
    saveAiHistory(history);
    appendMessage('assistant', cleanReply, aiTs);
    if (action) renderActionCard(action, document.getElementById('ai-msgs'), 'sm');
  } catch(e) {
    removeTypingIndicator();
    const errTs = new Date().toISOString();
    const errMsg = '⚠ Could not reach AI. Check your connection and API key.';
    const h = getAiHistory(); h.push({ role: 'assistant', content: errMsg, ts: errTs }); saveAiHistory(h);
    appendMessage('assistant', errMsg, errTs);
  } finally {
    aiTyping = false;
    document.getElementById('ai-send-btn').disabled = false;
  }
}

function confirmClearHistory(){
  if (!confirm('Clear all AI conversation history?')) return;
  clearAiHistory();
  document.getElementById('ai-msgs').innerHTML = `<div class="ai-empty" id="ai-empty"><i class="fa-solid fa-robot"></i><p>History cleared. Ask me anything!</p></div>`;
}
</script>
</body>
</html>
